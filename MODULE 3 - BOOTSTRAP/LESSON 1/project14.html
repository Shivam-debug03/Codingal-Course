<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Club Website.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .bankai {
            background-color: black;
            color: white;
            font-style: italic;
            text-align: center;
            padding: 10px;
            margin: 10px;
            border: 2px;
        }

        .Coding-Club {
            text-align: center;
            background-color: darkblue;
            padding: 20px;
            border: 2px solid lightblue;
        }
    </style>

</head>

<body>
    <div class="bankai">
 <h1>School Clubs</h1>
    </div>

            <div class="row g-4">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card h-100 bg-dark text-white border-light">
                        <div class="card-body">
                            <h2 class="card-title">Coding Club</h2>
                            <p class="card-text">Practice algorithms, build software apps, and learn together.</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card h-100 bg-dark text-white border-light">
                        <div class="card-body">
                            <h2 class="card-title">Anime Club</h2>
                            <p class="card-text">Watch Anime, discuss Japanese pop culture, play themed games, and share creative work like fan art or cosplay.
                            </p>
                        </div>
                    </div>
                </div>
                
              
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card h-100 bg-dark text-white border-light">
                        <div class="card-body">
                            <h2 class="card-title">Science Club</h2>
                            <p class="card-text">Explore science experiments, technology concepts, and project ideas.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
