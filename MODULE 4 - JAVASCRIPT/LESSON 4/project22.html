<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sosuke Aizen Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f1ff;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #5b21b6;
        text-align: center;
      }

      .box {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 15px;
        margin-top: 20px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #eee;
        padding: 10px 0;
      }

      .row:last-child {
        border-bottom: none;
      }

      .label {
        font-weight: bold;
        color: #555;
      }

      .value {
        color: #222;
      }

      pre {
        background: #f9f5ff;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #e8ddff;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sosuke Aizen Profile</h1>

      <div class="box">
        <div class="row">
          <div class="label">Name:</div>
          <div class="value" id="name"></div>
        </div>

        <div class="row">
          <div class="label">Anime:</div>
          <div class="value" id="anime"></div>
        </div>

        <div class="row">
          <div class="label">Characteristics:</div>
          <div class="value" id="characteristics"></div>
        </div>

        <div class="row">
          <div class="label">Nickname:</div>
          <div class="value" id="nickname"></div>
        </div>

        <div class="row">
          <div class="label">Power:</div>
          <div class="value" id="power"></div>
        </div>

        <div class="row">
          <div class="label">Extra Thing:</div>
          <div class="value" id="extraThing"></div>
        </div>
      </div>

      <div class="box">
        <h3>JavaScript Object</h3>
        <pre id="codeDisplay"></pre>
      </div>
    </div>

    <script>
      const favouriteAnimeCharacter = {
        name: "Sosuke Aizen",
        anime: "Bleach",
        characteristics: "Calm, intelligent, manipulative, powerful",
        nickname: "The Mastermind of the Soul Society",
        power: "Kyoka Suigetsu, Hōgyoku, immense spiritual pressure",
        extraThing: "Former captain of the 5th Division",
      };

      document.getElementById("name").textContent =
        favouriteAnimeCharacter.name;
      document.getElementById("anime").textContent =
        favouriteAnimeCharacter.anime;
      document.getElementById("characteristics").textContent =
        favouriteAnimeCharacter.characteristics;
      document.getElementById("nickname").textContent =
        favouriteAnimeCharacter.nickname;
      document.getElementById("power").textContent =
        favouriteAnimeCharacter.power;
      document.getElementById("extraThing").textContent =
        favouriteAnimeCharacter.extraThing;

      document.getElementById("codeDisplay").textContent = JSON.stringify(
        favouriteAnimeCharacter,
        null,
        2,
      );
    </script>
  </body>
</html>
