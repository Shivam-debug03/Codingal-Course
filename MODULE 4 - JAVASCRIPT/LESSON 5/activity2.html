<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="result"></p>

    <script>
      function add(a, b, c) {
        return a + b + c;
      }

      function average(a, b, c) {
        return add(a , b , c) / 3;
      }

      document.getElementById("result").innerHTML = average(19, 17, 30 );
    </script>
  </body>
</html>
