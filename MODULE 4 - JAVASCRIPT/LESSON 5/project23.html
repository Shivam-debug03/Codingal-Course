<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Objects and Array</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 30px;
      }

      h2 {
        color: #2f4f4f;
      }
    </style>
  </head>
  <body>
    <h2>JavaScript Objects and Array</h2>

    <script>
      const student = {
        name: "Riya",
        age: 12,
        grade: "7",
        hobbies: ["Drawing", "Reading", "Dancing"],
        favSport: "Cricket",
      };

      const colors = ["white", "black", "red", "green", "blue"];

      document.write("Student name is: " + student.name + "<br>");
      document.write("Student favorite sport is: " + student.favSport + "<br>");
      document.write(
        "Before popping, colors are: " + colors.join(" ^ ") + "<br>",
      );
      document.write("My favorite color is: " + colors[3] + "<br>");

      colors.pop();

      document.write(
        "After popping, colors are: " + colors.join(" * ") + "<br>",
      );
      document.write("Student hobbies: " + student.hobbies.join(", "));
    </script>
  </body>
</html>
