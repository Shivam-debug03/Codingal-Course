<!doctype html>
<html>
  <head>
    <title>Module 5 - Lesson 1 - Activity 1 - My Game Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: aliceblue;
        text-align: center;
        padding: 30px;
      }
      h1 {
        color: navy;
      }
      button {
        background: navy;
        color: white;
        padding: 10px 25px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
      }
      div {
        border: 1px solid navy;
        width: 280px;
        margin: 6px auto;
        padding: 8px 12px;
        text-align: left;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>My Game Profile</h1>
    <button onclick="showProfile()">Show Profile</button>

    <div><strong>Name: </strong><span id="name"></span></div>
    <div><strong>Score: </strong><span id="score"></span></div>
    <div><strong>Top Score: </strong><span id="record"></span></div>
    <div><strong>Rank: </strong><span id="rank"></span></div>
    <div><strong>Greeting: </strong><span id="greeting"></span></div>
    <div><strong>Stars: </strong><span id="stars"></span></div>
    <div><strong>Bonus Level: </strong><span id="bonus"></span></div>
    <div><strong>Team Name: </strong><span id="team"></span></div>

    <script>
      function showProfile() {
        let name = "Shivam Vaghela";
        document.getElementById("name").innerHTML = name;

        let bonus = null;
        document.getElementById("bonus").innerHTML = bonus;

        let myScore = 10000;
        let topScore = 10000;
        let isTopScorer;

        if (myScore == topScore) {
          isTopScorer = "✅";
        } else {
          isTopScorer = "❌";
        }

        document.getElementById("record").innerHTML = isTopScorer;
        document.getElementById("score").innerHTML =
          "Mine " + myScore + " / High Score: " + topScore;

        let rank;
        if (myScore >= 8000) {
          rank = "🥇 Gold Medal";
        } else if (myScore >= 5000) {
          rank = "🥈 Silver Medal";
        } else {
          rank = "🥉 Bronze Medal";
        }
        document.getElementById("rank").innerHTML = rank;
        
        let hour = new Date().getHours();
        let greeting;
        if(hour < 12){
          greeting = "Good Morning!";
        }else if (hour<18){
          greeting = "Good Afternoon!";
        }else{
          greeting=" Good Evening!";
        }

        document.getElementById("greeting").innerHTML = greeting ; 

        let football="";
        let count= 1;

        while(count <= 5){
          football = football + "⚽";
          count++;
        }
        document.getElementById("stars").innerHTML = football;
      }
    </script>
  </body>
</html>
