<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Registration Form</title>

  <style>
    :root {
      --bg-1: #eef4ff;
      --bg-2: #dfe9ff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --primary-soft: #dbeafe;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text: #1f2937;
      --muted: #5b6473;
      --border: #cfe0ff;
      --shadow: rgba(59, 130, 246, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg-1), var(--bg-2) 55%, #ccd8ff 100%);
      padding: 24px;
    }

    .form-card {
      width: min(100%, 560px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px 26px;
      box-shadow: 0 18px 40px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      color: var(--primary-dark);
      font-size: clamp(2rem, 4vw, 2.5rem);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
    }

    input,
    select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #c1d7ff;
      border-radius: 12px;
      font-size: 1rem;
      background: #ffffff;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    button {
      margin-top: 8px;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 12px 22px rgba(29, 78, 216, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(29, 78, 216, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    #feedback {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 14px;
      font-weight: 700;
      line-height: 1.7;
      border: 2px solid transparent;
      background: #f8fbff;
      color: var(--muted);
      transition: all 0.25s ease;
    }

    .success {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: #22c55e;
    }

    .error {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: #ef4444;
    }

    @media (max-width: 520px) {
      .form-card {
        padding: 24px 18px 20px;
      }

      h1 {
        margin-top: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="form-card">
    <span class="badge">School Event</span>
    <h1>Event Registration</h1>

    <p class="subtitle">
      Fill in the form below to register for the upcoming school event and receive your event pass.
    </p>

    <form id="eventForm" novalidate>
      <div class="field">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" required minlength="3" placeholder="Enter your full name" />
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="Enter your email address" />
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" required min="8" max="18" placeholder="Enter your age" />
      </div>

      <div class="field">
        <label for="eventName">Choose Event</label>
        <select id="eventName" required>
          <option value="">Select an event</option>
          <option value="Science Fair">Science Fair</option>
          <option value="Coding Workshop">Coding Workshop</option>
          <option value="Art Competition">Art Competition</option>
          <option value="Sports Day">Sports Day</option>
        </select>
      </div>

      <button type="button" onclick="registerEvent()">Register Now</button>
    </form>

    <div id="feedback">Waiting for registration...</div>
  </div>

  <script>
    function showFeedback(type, message) {
      const feedback = document.getElementById("feedback");
      feedback.className = type;
      feedback.innerHTML = message;
    }

    function registerEvent() {
      const form = document.getElementById("eventForm");

      try {
        if (!form.checkValidity()) {
          throw form.reportValidity();
        }

        const studentName = document.getElementById("studentName").value.trim();
        const email = document.getElementById("email").value.trim();
        const age = Number(document.getElementById("age").value);
        const eventName = document.getElementById("eventName").value;

        if (studentName.length < 3) {
          throw "Name must contain at least 3 characters.";
        }

        if (age < 8 || age > 18) {
          throw "Age must be between 8 and 18.";
        }

        if (!eventName) {
          throw "Please select an event.";
        }

        showFeedback("", "Checking your registration details...");

        setTimeout(function () {
          const passNumber = Math.floor(Math.random() * 9000) + 1000;
          showFeedback(
            "success",
            "Registration Successful!<br>" +
            "Student Name: " + studentName + "<br>" +
            "Email: " + email + "<br>" +
            "Age: " + age + "<br>" +
            "Event: " + eventName + "<br>" +
            "Your Event Pass Number: EVT-" + passNumber
          );
        }, 1400);
      } catch (error) {
        const message = (error !== undefined) ? "Registration failed: " + error : "Please complete all required fields correctly.";
        showFeedback("error", message);
      }
    }
  </script>
</body>
</html>
